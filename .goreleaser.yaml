version: 2

project_name: keyward

# O GoReleaser NÃO builda nem arquiva nada neste projeto — ele cuida só do
# changelog agrupado, do checksums.txt e da criação do GitHub Release.
#
# Motivo: os artefatos precisam de cgo + webview nativo (GUI via Wails) e,
# no macOS, de um bundle `keyward-gui.app` — que é um DIRETÓRIO. O
# GoReleaser não percorre diretórios recursivamente nos globs de
# `archives.files` (ele chama fileglob.Glob e processa cada match direto,
# sem walk), então o bundle não entraria num archive montado por ele. Além
# disso, os instaladores precisam dos três binários no mesmo job que os
# empacota. Por isso cada runner nativo monta o próprio archive e o próprio
# instalador (ver .github/workflows/release.yml) e deposita tudo em
# dist-release/, que entra aqui via extra_files.
builds:
  - skip: true

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: dist-release/*

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "(?i)^merge"
  groups:
    - title: "Funcionalidades"
      regexp: '(?i)^feat(\([^)]*\))?!?:'
      order: 0
    - title: "Correções"
      regexp: '(?i)^fix(\([^)]*\))?!?:'
      order: 1
    - title: "Outras mudanças"
      order: 999

release:
  # "auto": detecta sufixo semver de pré-lançamento na tag (-alpha/-beta/-rc)
  # e marca o GitHub Release correspondente como "Pre-release" automaticamente.
  prerelease: auto
  extra_files:
    - glob: dist-release/*
