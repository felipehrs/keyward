name: Release

# Dispara só em push de tag vX.Y.Z. O ci.yml continua cuidando de push/PR
# pra main; este workflow é só o pipeline de release, com permissão de
# escrita (contents: write) que o ci.yml deliberadamente não tem.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Cada runner é autossuficiente: builda as TRÊS interfaces pro seu próprio
  # SO, monta o arquivo compactado e o instalador, e sobe tudo pronto. O
  # GoReleaser não builda nada (ver .goreleaser.yaml) — a GUI precisa de cgo
  # + webview nativo, e no macOS o artefato é um bundle .app, que é um
  # diretório e não caberia no modelo de archives dele.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Precisa vir ANTES do "go install .../wails3" — o pacote
      # internal/operatingsystem do próprio wails3 faz um check de cgo via
      # pkg-config (gtk4/webkitgtk-6.0) já na hora de *compilar* o CLI, não
      # só na hora de empacotar. Sem isso instalado antes, `go install`
      # falha com "Package gtk4 was not found in the pkg-config search path".
      - name: Install GTK4/WebKitGTK dev libs (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # choco instala o NSIS, mas o PATH atualizado pelo instalador não é
      # herdado automaticamente pelos passos seguintes do job — precisa ser
      # adicionado explicitamente ao $GITHUB_PATH.
      - name: Install NSIS (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          choco install nsis -y
          echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      # VERSION alimenta as ldflags de main.version e o ${VERSION} do
      # nfpm.yaml. VERSION_NUMERIC descarta o sufixo de pré-lançamento
      # (0.2.0-beta.1 -> 0.2.0) porque o NSIS monta VIProductVersion como
      # "${INFO_PRODUCTVERSION}.0" e exige 4 partes puramente numéricas —
      # uma tag beta quebraria o makensis.
      - name: Derive version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_NUMERIC=${VERSION%%-*}" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # Linux
      # ---------------------------------------------------------------
      # A GUI é buildada PRIMEIRO e renomeada na sequência: `wails3 task
      # build` sempre emite bin/keyward, que é exatamente o nome do binário
      # da CLI — inverter a ordem faria um sobrescrever o outro.
      # CGO_ENABLED=0 vai por comando, NÃO no env do step: a GUI do Linux
      # precisa de cgo (o Taskfile do Wails força CGO_ENABLED=1), e um
      # env de step vaza pra dentro do `wails3 task build`, fazendo o
      # pacote application do Wails falhar com "undefined: pointer".
      - name: Build all three binaries (Linux)
        if: matrix.platform == 'linux'
        working-directory: internal/adapter/gui
        run: |
          wails3 task build
          mv bin/keyward bin/keyward-gui
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${VERSION}" -o bin/keyward     github.com/felipehrs/keyward/cmd/cli
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${VERSION}" -o bin/keyward-tui github.com/felipehrs/keyward/cmd/tui

      - name: Assemble archive and packages (Linux)
        if: matrix.platform == 'linux'
        working-directory: internal/adapter/gui
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist-release"
          tar czf "${GITHUB_WORKSPACE}/dist-release/keyward_${VERSION}_linux_amd64.tar.gz" \
            -C bin keyward keyward-tui keyward-gui
          # generate:* em vez de create:* de propósito: as tasks create:deb/
          # create:rpm têm `deps: build`, que rebuildaria a GUI por cima de
          # bin/keyward — onde agora mora a CLI.
          wails3 task linux:generate:dotdesktop
          wails3 task linux:generate:deb
          wails3 task linux:generate:rpm
          mv bin/*.deb bin/*.rpm "${GITHUB_WORKSPACE}/dist-release/"

      # ---------------------------------------------------------------
      # Windows
      # ---------------------------------------------------------------
      # CGO_ENABLED por comando pelo mesmo motivo do Linux (ver acima) —
      # aqui a GUI do Windows já usa CGO_ENABLED=0 por default, mas deixar
      # no env do step seria a mesma armadilha esperando acontecer.
      - name: Build all three binaries (Windows)
        if: matrix.platform == 'windows'
        working-directory: internal/adapter/gui
        shell: bash
        run: |
          wails3 task build
          mv bin/keyward.exe bin/keyward-gui.exe
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${VERSION}" -o bin/keyward.exe     github.com/felipehrs/keyward/cmd/cli
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${VERSION}" -o bin/keyward-tui.exe github.com/felipehrs/keyward/cmd/tui

      - name: Assemble archive (Windows)
        if: matrix.platform == 'windows'
        working-directory: internal/adapter/gui
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/dist-release" | Out-Null
          Compress-Archive -Path bin/keyward.exe,bin/keyward-tui.exe,bin/keyward-gui.exe `
            -DestinationPath "$env:GITHUB_WORKSPACE/dist-release/keyward_${env:VERSION}_windows_amd64.zip"

      # makensis é chamado direto, não via `wails3 task windows:create:nsis:
      # installer`: aquela task tem `deps: build` (rebuildaria a GUI sobre a
      # CLI) e aponta ARG_WAILS_AMD64_BINARY pra bin/keyward.exe, que agora
      # é a CLI. O project.nsi puxa CLI e TUI de bin/ por conta própria.
      - name: Build NSIS installer (Windows)
        if: matrix.platform == 'windows'
        working-directory: internal/adapter/gui
        shell: bash
        run: |
          wails3 generate webview2bootstrapper -dir "$(pwd)/build/windows/nsis"
          cd build/windows/nsis
          makensis \
            -DINFO_PRODUCTVERSION="${VERSION_NUMERIC}" \
            -DARG_WAILS_AMD64_BINARY="$(cygpath -w "$(pwd)/../../../bin/keyward-gui.exe")" \
            project.nsi
          mv ../../../bin/*-installer.exe "${GITHUB_WORKSPACE}/dist-release/"

      # ---------------------------------------------------------------
      # macOS — universal (amd64 + arm64) nos três executáveis
      # ---------------------------------------------------------------
      # package:universal já builda as duas arquiteturas, faz lipo e monta o
      # .app. Depois dele bin/keyward é o binário universal da GUI, que pode
      # ser descartado: o bundle já tem sua própria cópia dentro.
      - name: Build all three binaries (macOS)
        if: matrix.platform == 'darwin'
        working-directory: internal/adapter/gui
        run: |
          wails3 task darwin:package:universal
          mv bin/keyward.app bin/keyward-gui.app
          rm -f bin/keyward
          for cmd in cli tui; do
            [ "$cmd" = "cli" ] && out=keyward || out=keyward-tui
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" \
                go build -ldflags "-s -w -X main.version=${VERSION}" \
                -o "bin/${out}-${arch}" "github.com/felipehrs/keyward/cmd/${cmd}"
            done
            lipo -create -output "bin/${out}" "bin/${out}-amd64" "bin/${out}-arm64"
            rm "bin/${out}-amd64" "bin/${out}-arm64"
          done

      - name: Assemble archive (macOS)
        if: matrix.platform == 'darwin'
        working-directory: internal/adapter/gui
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist-release"
          tar czf "${GITHUB_WORKSPACE}/dist-release/keyward_${VERSION}_darwin_universal.tar.gz" \
            -C bin keyward keyward-tui keyward-gui.app

      # ---------------------------------------------------------------
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist-release
          merge-multiple: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
