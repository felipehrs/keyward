name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # internal/adapter/gui importa o Wails v3, que faz um check cgo via
      # pkg-config (gtk4/webkitgtk-6.0) já em tempo de compilação — sem isso,
      # `go vet`/`go build`/lint na raiz falham pra qualquer alvo que inclua
      # esse pacote, mesmo sem gerar nenhum binário GUI de verdade (mesma
      # dependência que o job "package-gui" do release.yml já tem).
      - name: Install GTK4/WebKitGTK dev libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
